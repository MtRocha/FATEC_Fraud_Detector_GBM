<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Por dentro da decisão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;
    --ink: #e6edfb;
    --muted: rgba(230, 237, 251, .62);
    --faint: rgba(230, 237, 251, .14);
    --accent: #4f8cff;
    --accent-2: #9cc4ff;
    --accent-3: #1d4ed8;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --glass: rgba(8, 13, 26, .6);
    --glass-line: rgba(130, 170, 255, .18);
    --ease: cubic-bezier(.2, .7, .1, 1);
    --display: "Inter Tight", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-snap-type: y proximity; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  #field { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 90% at 30% 55%, transparent 40%, rgba(5, 7, 13, .78) 100%),
                linear-gradient(180deg, rgba(5, 7, 13, .75) 0%, transparent 22%, transparent 70%, rgba(5, 7, 13, .85) 100%); }

  /* ---------- barra superior e navegação ---------- */
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 28px; font-size: 13px; }
  .top a { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
  .top .back span.circle { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(230, 237, 251, .1); backdrop-filter: blur(8px); }
  .top .hint { color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .top .hint::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .top .right { justify-self: end; color: var(--muted); }
  .top .right b { color: var(--ink); font-weight: 600; }

  .chapters { position: fixed; right: 28px; top: 50%; transform: translateY(-50%); z-index: 10; display: grid; gap: 6px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
  .chapters button { all: unset; cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 2px 0; }
  .chapters button .name { opacity: 0; transform: translateX(6px); transition: .4s var(--ease); white-space: nowrap; }
  .chapters button::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .6; transition: .4s var(--ease); }
  .chapters button.on { color: var(--ink); }
  .chapters button.on .name, .chapters:hover .name { opacity: 1; transform: none; }
  .chapters button.on::after { background: var(--accent); opacity: 1; box-shadow: 0 0 10px var(--accent); width: 7px; height: 7px; }
  .chapters button:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

  /* ---------- capítulos ---------- */
  main { position: relative; z-index: 2; }
  .chapter { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; padding: 110px max(8vw, 28px) 90px; scroll-snap-align: start; position: relative; }
  .inner { width: 100%; max-width: 1180px; margin-right: 90px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: .22em; font-size: 11.5px; color: var(--accent-2); margin-bottom: 22px; }
  .eyebrow b { font-weight: 600; color: var(--ink); letter-spacing: .1em; }
  .display { font-family: var(--display); font-weight: 300; font-size: clamp(2.6rem, 7.2vw, 6.4rem); line-height: .95; letter-spacing: -.035em; margin: 0; }
  .display .s { background: linear-gradient(180deg, #cfe0ff, var(--accent) 60%, var(--accent-3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .display.md { font-size: clamp(2.2rem, 5.2vw, 4.4rem); }
  .line { display: block; overflow: hidden; padding-bottom: .06em; }
  .line > span { display: inline-block; transform: translateY(110%); transition: transform 1.2s var(--ease); transition-delay: calc(var(--d, 0) * 120ms); }
  .in .line > span { transform: none; }
  .caption { max-width: 440px; color: var(--muted); font-size: 15.5px; margin: 22px 0 0; }
  .caption b { color: var(--ink); font-weight: 500; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 56px; align-items: center; }
  @media (max-width: 960px) { .split { grid-template-columns: 1fr; gap: 32px; } .inner { margin-right: 0; } .chapters { display: none; } }

  [data-r] { opacity: 0; transform: translateY(28px); filter: blur(6px); transition: opacity 1s var(--ease), transform 1.1s var(--ease), filter 1s var(--ease); transition-delay: calc(var(--d, 0) * 90ms); }
  .in [data-r] { opacity: 1; transform: none; filter: none; }
  @media (prefers-reduced-motion: reduce) {
    [data-r], .line > span { transition: none !important; opacity: 1; transform: none; filter: none; }
  }

  .glass { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; padding: 22px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .hero-meta { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; flex-wrap: wrap; margin-top: 40px; }
  .hero-meta .caption { margin: 0; }
  .big-num { font-family: var(--display); font-weight: 200; font-size: clamp(2.6rem, 6vw, 5rem); letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .big-num small { font-size: .35em; color: var(--muted); font-weight: 300; letter-spacing: 0; margin-left: .3em; }

  /* fatos da compra */
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .fact { padding: 16px 18px; }
  .fact span { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
  .fact b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.45rem; margin-top: 4px; }
  .fact em { font-style: normal; color: var(--muted); font-size: 13px; }

  /* features */
  .features { display: grid; gap: 4px; }
  .feat { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: baseline; padding: 11px 4px; border-bottom: 1px solid var(--faint); }
  .feat span { color: var(--muted); }
  .feat span code { font-family: ui-monospace, monospace; font-size: 12px; color: var(--accent-2); opacity: .8; margin-left: 6px; }
  .feat b { font-family: var(--display); font-weight: 400; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .cats { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 18px; }
  .cat { border: 1px solid var(--faint); border-radius: 10px; padding: 8px 6px; font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; min-height: 58px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .cat i { font-style: normal; font-family: var(--display); font-size: 18px; color: var(--ink); opacity: .5; }
  .cat.on { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 24px rgba(79, 140, 255, .35), inset 0 0 18px rgba(79, 140, 255, .18); }
  .cat.on i { color: var(--accent-2); opacity: 1; }
  @media (max-width: 640px) { .cats { grid-template-columns: repeat(4, minmax(0, 1fr)); } .facts { grid-template-columns: 1fr; } }

  /* árvore */
  .tree svg { width: 100%; height: auto; display: block; overflow: visible; }
  .tree .edge { stroke: var(--faint); stroke-width: 1.4; fill: none; }
  .tree .edge.on { stroke: var(--accent); stroke-width: 3; filter: drop-shadow(0 0 6px rgba(79, 140, 255, .8)); stroke-dasharray: 400; stroke-dashoffset: 400; transition: stroke-dashoffset .7s var(--ease); }
  .tree .edge.on.lit { stroke-dashoffset: 0; }
  .tree .node { fill: rgba(230, 237, 251, .25); }
  .tree .node.path { fill: var(--bg); stroke: var(--accent); stroke-width: 2.5; transition: fill .4s; }
  .tree .node.path.lit { fill: var(--accent); }
  .tree .num { fill: var(--bg); font: 600 13px "Inter", sans-serif; text-anchor: middle; dominant-baseline: central; opacity: 0; transition: opacity .3s; }
  .tree .num.lit { opacity: 1; }
  .tree .leaf-label { fill: var(--accent-2); font: 500 15px "Inter", sans-serif; text-anchor: middle; opacity: 0; transition: opacity .5s; }
  .tree .leaf-label.lit { opacity: 1; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
  .steps li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; opacity: .25; transition: opacity .5s; }
  .steps li.lit { opacity: 1; }
  .steps li::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--bg); font-weight: 600; font-size: 13px; }
  .steps li.leaf::before { content: "✓"; background: var(--accent-2); }
  .steps .q { font-family: var(--display); font-size: 1.15rem; }
  .steps .a { color: var(--muted); font-size: 14px; }
  .steps .a b { color: var(--accent-2); font-weight: 600; }

  /* árvores que mais pesaram */
  .tops { display: grid; gap: 12px; }
  .top-tree { display: grid; grid-template-columns: 110px minmax(0, 1fr) 300px; gap: 18px; align-items: center; padding: 16px 20px; }
  .top-tree h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.1rem; }
  .top-tree h4 small { display: block; color: var(--muted); font: 12px "Inter", sans-serif; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--faint); color: var(--ink); white-space: nowrap; }
  .chip + .chip::before { content: "→ "; color: var(--accent); }
  .contrib { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 10px; align-items: center; }
  .contrib .track2 { position: relative; height: 34px; }
  .contrib .axis { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--faint); }
  .contrib .bar { position: absolute; top: 9px; height: 16px; border-radius: 4px; width: 0; transition: width 1.1s var(--ease); }
  .contrib .bar.pos { left: 50%; background: linear-gradient(90deg, var(--accent), var(--accent-3)); box-shadow: 0 0 14px rgba(79, 140, 255, .5); }
  .contrib .bar.neg { right: 50%; background: linear-gradient(270deg, rgba(230, 237, 251, .85), rgba(230, 237, 251, .35)); }
  .contrib .val { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
  .legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 10px; }
  @media (max-width: 760px) { .top-tree { grid-template-columns: 1fr; } }

  /* gráficos */
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .grid line { stroke: var(--faint); }
  .chart .tick { fill: var(--muted); font: 12px "Inter", sans-serif; }
  .chart .cut { stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 6 6; }
  .chart .cut-label { fill: var(--bad); font: 500 13px "Inter", sans-serif; }
  .chart .curve { fill: none; stroke: var(--accent); stroke-width: 2.6; filter: drop-shadow(0 0 6px rgba(79, 140, 255, .6)); }
  .chart .dot { fill: var(--accent-2); filter: drop-shadow(0 0 8px var(--accent)); }
  .chart .dot-label { fill: var(--ink); font: 500 14px "Inter", sans-serif; }
  .chart .guide { stroke: var(--accent-2); stroke-width: 1; stroke-dasharray: 3 4; opacity: .7; }
  .formula { font-family: ui-monospace, monospace; font-size: 15px; color: var(--accent-2); margin-top: 18px; }

  /* território */
  .terr { display: grid; gap: 14px; }
  .terr-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 110px; gap: 18px; align-items: center; padding: 16px 20px; }
  .terr-row h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
  .terr-row h4 small { display: block; color: var(--muted); font: 12.5px "Inter", sans-serif; margin-top: 2px; }
  .track { position: relative; height: 40px; }
  .track .known { position: absolute; left: 12%; right: 12%; top: 17px; height: 6px; border-radius: 6px; background: linear-gradient(90deg, rgba(79, 140, 255, .3), rgba(79, 140, 255, .7), rgba(79, 140, 255, .3)); }
  .track .edge-label { position: absolute; top: 28px; font-size: 11.5px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
  .track .marker { position: absolute; top: 9px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 5px rgba(230, 237, 251, .15); left: 50%; transition: left 1.2s var(--ease); }
  .track .marker.out { background: var(--bad); box-shadow: 0 0 0 6px rgba(248, 113, 113, .25), 0 0 20px var(--bad); }
  .status { text-align: right; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); } .status.na { color: var(--muted); }
  .terr-row.na { opacity: .55; }
  @media (max-width: 760px) { .terr-row { grid-template-columns: 1fr; } .status { text-align: left; } }

  /* decisão */
  .verdict { font-family: var(--display); font-weight: 200; font-size: clamp(3.4rem, 13vw, 11rem); letter-spacing: -.05em; line-height: .9; margin: 0; }
  .verdict.ok { color: var(--ok); text-shadow: 0 0 60px rgba(74, 222, 128, .35); }
  .verdict.warn { color: var(--warn); text-shadow: 0 0 60px rgba(251, 191, 36, .35); }
  .verdict.bad { color: var(--bad); text-shadow: 0 0 60px rgba(248, 113, 113, .4); }
  .reasons { margin: 26px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 760px; }
  .reasons li { padding: 14px 18px; font-size: 16px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 999px; text-decoration: none; font-weight: 500; color: var(--bg); background: var(--ink); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid rgba(230, 237, 251, .35); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .state { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; position: relative; z-index: 2; }
  .state p { color: var(--muted); max-width: 480px; }
  @media (max-width: 640px) { .top { padding: 14px 16px; grid-template-columns: auto 1fr; } .top .hint { display: none; } .chapter { padding: 96px 16px 64px; } }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="vignette"></div>

<div class="top">
  <a class="back" href="painel.html"><span class="circle">←</span> <span>Painel</span></a>
  <div class="hint">Role para entender</div>
  <div class="right">Compra nº <b id="topId">–</b></div>
</div>

<nav class="chapters" id="chapters" aria-label="Etapas"></nav>

<div class="state" id="loading"><div><div class="eyebrow">Fraud Detector</div><p>Refazendo o cálculo desta compra…</p></div></div>
<main id="story" hidden></main>

<script>
/* =====================================================================
   Rótulos e formatação
   ===================================================================== */
const CAT = {
  grocery_pos: "Supermercado (loja)", grocery_net: "Supermercado (online)", shopping_pos: "Compras (loja)",
  shopping_net: "Compras (online)", food_dining: "Restaurante", gas_transport: "Combustível e transporte",
  entertainment: "Entretenimento", health_fitness: "Saúde e academia", personal_care: "Cuidados pessoais",
  home: "Casa", kids_pets: "Crianças e pets", travel: "Viagem", misc_pos: "Outros (loja)", misc_net: "Outros (online)"
};
const LABEL = { amount: "Valor", hour: "Hora", day_of_week: "Dia da semana", age: "Idade", distance_km: "Distância", is_male: "Gênero masculino" };
const DAYS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const SYMBOL = { BRL: "R$", USD: "US$", EUR: "€" };
const nf = (v, d = 2) => Number(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const money = (v, c = "USD") => `${SYMBOL[c] || c} ${nf(v)}`;
const signed = (v, d = 3) => (v >= 0 ? "+" : "−") + nf(Math.abs(v), d);
const pct = (p, d = 2) => {
  const v = p * 100;
  if (v > 0 && v < 0.01) return "menos de 0,01%";
  if (v < 100 && v > 99.99) return "mais de 99,99%";
  return nf(v, d) + "%";
};
const sigmoid = s => 1 / (1 + Math.exp(-s));
/** Versão curta para os números grandes, que não podem quebrar linha. */
const pctShort = p => {
  const v = p * 100;
  if (v > 0 && v < 0.01) return "< 0,01%";
  if (v < 100 && v > 99.99) return "> 99,99%";
  return nf(v, 2) + "%";
};

function fmtFeature(name, v) {
  switch (name) {
    case "amount": return money(v);
    case "hour": return Number.isInteger(v) ? `${v}h` : nf(v, 1) + "h";
    case "day_of_week": return Number.isInteger(v) ? DAYS[v] : nf(v, 1);
    case "age": return Number.isInteger(v) ? `${v} anos` : `${nf(v, 1)} anos`;
    case "distance_km": return `${nf(v, v < 10 ? 1 : 0)} km`;
    default: return nf(v, 0);
  }
}
/** A pergunta que a árvore fez, em português, e a resposta para esta compra. */
function question(step) {
  const f = step.feature;
  if (f.startsWith("cat_")) return { q: `A compra é em ${CAT[f.slice(4)]}?`, a: step.value >= .5 ? "Sim" : "Não", fact: "" };
  if (f === "is_male") return { q: "O titular é do gênero masculino?", a: step.value >= .5 ? "Sim" : "Não", fact: "" };
  return { q: `${LABEL[f]} até ${fmtFeature(f, step.threshold)}?`, a: step.goesLeft ? "Sim" : "Não", fact: `esta compra: ${fmtFeature(f, step.value)}` };
}
/** A mesma pergunta, escrita como fato verdadeiro para esta compra (para as "fichas"). */
function chip(step) {
  const f = step.feature;
  if (f.startsWith("cat_")) return (step.value >= .5 ? "é " : "não é ") + CAT[f.slice(4)].toLowerCase();
  if (f === "is_male") return step.value >= .5 ? "masculino" : "não masculino";
  return `${LABEL[f].toLowerCase()} ${step.goesLeft ? "≤" : ">"} ${fmtFeature(f, step.threshold)}`;
}

const $ = id => document.getElementById(id);
function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k === "style") node.style.cssText = v; else node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined) node.append(c.nodeType ? c : document.createTextNode(c));
  return node;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs = {}, text) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
function countUp(node, to, format, ms = 1400) {
  if (reduced) { node.textContent = format(to); return; }
  const start = performance.now();
  const tick = now => {
    const k = Math.min(1, (now - start) / ms), e = 1 - Math.pow(1 - k, 3);
    node.textContent = format(to * e);
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
/** Título grande com linhas que sobem de uma máscara, como na referência. */
function display(lines, cls = "display") {
  return h("h2", { class: cls }, lines.map((l, i) =>
    h("span", { class: "line" }, h("span", { style: `--d:${i}` }, ...[].concat(l)))));
}
const sp = text => h("span", { class: "s" }, text);

/* =====================================================================
   Campo de partículas (fundo)
   Uma superfície ondulada de pontos vista em perspectiva, desenhada a cada quadro.
   ===================================================================== */
const field = { color: [79, 140, 255], target: [79, 140, 255], amp: 1, targetAmp: 1, scroll: 0 };
(function particleField() {
  const canvas = $("field"), ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1, sparks = [];
  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1);
    W = canvas.width = innerWidth * DPR; H = canvas.height = innerHeight * DPR;
    sparks = Array.from({ length: innerWidth < 700 ? 60 : 140 }, () => ({ x: Math.random(), y: Math.random(), v: .00004 + Math.random() * .00012, p: Math.random() * 6.28 }));
  }
  addEventListener("resize", resize); resize();
  addEventListener("scroll", () => { field.scroll = scrollY / Math.max(1, document.body.scrollHeight - innerHeight); }, { passive: true });

  function frame(t) {
    for (let i = 0; i < 3; i++) field.color[i] += (field.target[i] - field.color[i]) * .03;
    field.amp += (field.targetAmp - field.amp) * .03;
    const [r, g, b] = field.color.map(Math.round);
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    const cols = innerWidth < 700 ? 90 : 160, rows = innerWidth < 700 ? 42 : 64;
    const horizon = H * (.5 - field.scroll * .12);
    const time = reduced ? 0 : t;
    for (let row = 0; row < rows; row++) {
      const z = row / rows;                 // 0 = perto, 1 = longe
      const depth = .55 + z * 2.6;
      const alpha = (1 - z) * .55 + .08;
      for (let col = 0; col < cols; col++) {
        const xn = (col / (cols - 1) - .5) * 2;
        const y = (Math.sin(xn * 3.1 + time * .00035 + z * 5.5) * .32
                 + Math.cos(z * 7.2 - time * .00027 + xn * 1.7) * .22
                 + Math.sin(xn * 9 + z * 13 + time * .0006) * .05) * field.amp;
        const sx = W / 2 + (xn * 3.2 / depth) * W * .42;
        const sy = horizon + ((.75 - y) / depth) * H * .3;
        if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
        const glow = Math.max(0, y + .45);
        ctx.fillStyle = `rgba(${r},${g},${b},${Math.min(1, alpha * (.35 + glow))})`;
        const size = (1.8 - z) * DPR * (.8 + glow * .6);
        ctx.fillRect(sx, sy, size, size);
      }
    }
    for (const p of sparks) {
      p.y -= p.v * (reduced ? 0 : 16); if (p.y < 0) { p.y = 1; p.x = Math.random(); }
      const tw = .3 + .7 * Math.abs(Math.sin(time * .001 + p.p));
      ctx.fillStyle = `rgba(${Math.min(255, r + 110)},${Math.min(255, g + 90)},${Math.min(255, b + 40)},${tw * .5})`;
      ctx.fillRect(p.x * W, p.y * H, 1.4 * DPR, 1.4 * DPR);
    }
    if (!reduced && !document.hidden) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !reduced) requestAnimationFrame(frame); });
})();

const chapters = [];   // { name, el, play }
function chapter(name, build, play) {
  const section = h("section", { class: "chapter", id: `c${chapters.length}` });
  const inner = h("div", { class: "inner" });
  section.append(inner);
  build(inner);
  chapters.push({ name, el: section, play, played: false });
  $("story").append(section);
}
function eyebrow(n, text) { return h("div", { class: "eyebrow", "data-r": "" }, h("b", {}, String(n).padStart(2, "0")), text); }

function buildStory(data) {
  const p = data.purchase, x = data.explanation;
  const F = Object.fromEntries(x.featureNames.map((n, i) => [n, x.features[i]]));
  const catName = x.featureNames.find(n => n.startsWith("cat_") && F[n] === 1)?.slice(4) || p.category;
  const online = catName.endsWith("_net");
  const decision = x.assessment.decisionCode || p.decision;
  const LOOK = {
    aprovada: { cls: "ok", word: "Aprovada", color: [74, 222, 128] },
    revisao: { cls: "warn", word: "Em revisão", color: [251, 191, 36] },

  document.title = `Compra nº ${p.id} — por dentro da decisão`;

  /* 00 — capa */

    el.append(

        h("p", { class: "caption", "data-r": "", style: "--d:4" },
          `${CAT[catName]}, ${online ? "online" : "presencial"}. Role para ver, etapa por etapa, como `,
          h("b", {}, `${x.contributions.length} árvores`), " chegaram ao veredito.")));
  });

  /* 01 — a compra chega */
  chapter("A compra", el => {
    const rate = p.amount ? p.amountInModelCurrency / p.amount : 1;
    const facts = [
      ["Valor", money(p.amount, p.currency), p.currency !== "USD" ? `o modelo vê ${money(p.amountInModelCurrency)} (cotação ${nf(rate, 4)})` : "já em dólar, a moeda do treino"],
      ["Comércio", CAT[catName], online ? "compra online" : "compra presencial"],
      ["Quando", `${DAYS[F.day_of_week]}, ${p.hour}h`, "hora local da compra"],

        h("p", { class: "caption", "data-r": "", style: "--d:2" }, "O modelo não entende texto nem datas. A hora e o dia da semana saem da data; a idade, do nascimento; a distância, das coordenadas (fórmula de haversine). A categoria vira 14 colunas de 0 ou 1: só a da compra fica acesa.")),

  /* 03 — ponto de partida */
  let startNodes;
  chapter("Ponto de partida", el => {
    startNodes = { rate: h("div", { class: "big-num" }, "0%"), score: h("div", { class: "big-num" }, "0") };
    el.append(h("div", { class: "split" },
      h("div", {}, eyebrow(3, "O ponto de partida"), display(["Antes de olhar", sp("a compra")], "display md"),
        h("p", { class: "caption", "data-r": "", style: "--d:2" }, "O modelo começa pela taxa de fraude do treino. Como ele soma correções, trabalha numa escala chamada ", h("b", {}, "score"), " (log-odds), que vai de menos infinito a mais infinito. Score zero é 50%; negativo, menos que isso.")),
      h("div", { class: "facts" },
        h("div", { class: "fact glass", "data-r": "", style: "--d:2" }, h("span", {}, "Taxa de fraude no treino"), startNodes.rate, h("em", {}, "de cada 1.000 compras, cerca de 6 eram fraude")),
        h("div", { class: "fact glass", "data-r": "", style: "--d:3" }, h("span", {}, "Score inicial"), startNodes.score, h("em", {}, "é daqui que as árvores partem")))));
  }, () => {
    countUp(startNodes.rate, sigmoid(x.initialScore), v => pctShort(v));
    countUp(startNodes.score, x.initialScore, v => signed(v, 2));
  });

  /* 04 — uma árvore por dentro */
  let treeAnim;
  chapter("Árvore 1", el => {
    const W = 1000, levels = 4, top = 30, gap = 120;
    const svg = s("svg", { viewBox: `0 0 ${W} ${top + gap * levels + 40}`, role: "img", "aria-label": "Árvore 1 com o caminho desta compra destacado" });
    const pathKeys = new Set(["0:0"]);

    (function draw(n, d, i) {

    const items = x.firstTreeTrace.path.map(st => {
      const q = question(st);
      return h("li", {}, h("div", {}, h("div", { class: "q" }, q.q), h("div", { class: "a" }, h("b", {}, q.a), q.fact ? ` — ${q.fact}` : "")));
    });
    const leaf = h("li", { class: "leaf" }, h("div", {}, h("div", { class: "q" }, "Chegou à folha"),
      h("div", { class: "a" }, `valor da folha ${signed(x.firstTreeTrace.leafValue)} × taxa ${nf(x.learningRate, 1)} = `, h("b", {}, `${signed(x.firstTreeTrace.contribution)} no score`))));
    el.append(h("div", { class: "split" },
      h("div", {}, eyebrow(4, "Uma árvore por dentro"), display(["Cada árvore", sp("faz perguntas")], "display md"),
        h("p", { class: "caption", "data-r": "", style: "--d:2" }, "Esta é a árvore 1, inteira. Cada nó compara uma variável com um corte aprendido no treino; a resposta decide o lado. No fim do caminho, a folha diz quanto somar ao score."),
        h("ol", { class: "steps", style: "margin-top:26px" }, items, leaf)),
      h("div", { class: "tree glass", "data-r": "", style: "--d:2" }, svg)));
    treeAnim = async () => {

        nodes[d]?.c.classList.add("lit"); nodes[d]?.label?.classList.add("lit");
        all[d]?.classList.add("lit");

        if (edges[d]) { edges[d].classList.add("lit"); await wait(450); }
      }

  }, () => treeAnim());

  /* 05 — as árvores que mais pesaram */
  let bars = [];
  chapter("As que mais pesaram", el => {
    const max = Math.max(...x.topTrees.map(t => Math.abs(t.contribution)));
    bars = [];
    const rows = x.topTrees.map((t, i) => {
      const bar = h("div", { class: "bar " + (t.contribution >= 0 ? "pos" : "neg") });
      const val = h("div", { class: "val" }, signed(t.contribution));
      bars.push([bar, Math.abs(t.contribution) / max * 46]);
      return h("div", { class: "top-tree glass", "data-r": "", style: `--d:${i + 2}` },
        h("h4", {}, `Árvore ${t.index}`, h("small", {}, `folha ${signed(t.leafValue, 2)}`)),
        h("div", { class: "chips" }, t.path.map(st => h("span", { class: "chip" }, chip(st)))),

      display(["Nem toda árvore", sp("pesa igual")], "display md"),
      h("p", { class: "caption", "data-r": "", style: "--d:2" }, "Cada árvore olha a compra por um ângulo. Estas cinco foram as que mais mexeram no score: para a direita, empurram para fraude; para a esquerda, para compra legítima."),
      h("div", { class: "tops", style: "margin-top:28px" }, rows),

  }, () => bars.forEach(([bar, w]) => bar.style.width = w + "%"));

  /* 06 — somando as árvores */
  let sumAnim;
  chapter("A soma", el => {
    const W = 1000, H = 420, L = 60, R = 30, T = 30, B = 40;
    const cum = [x.initialScore]; x.contributions.forEach(c => cum.push(cum[cum.length - 1] + c));
    const lo = Math.min(...cum, x.thresholdScore) - .5, hi = Math.max(...cum, x.thresholdScore) + .5;
    const X = i => L + i / (cum.length - 1) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Score acumulado árvore a árvore" });
    const grid = s("g", { class: "grid" });

    const d = cum.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");

  /* 07 — sigmoide */
  let sigAnim;
  chapter("Probabilidade", el => {
    const W = 1000, H = 420, L = 60, R = 30, T = 30, B = 40, MIN = -12, MAX = 12;

    [-10, -5, 0, 5, 10].forEach(v => svg.append(s("text", { class: "tick", x: X(v), y: H - 12, "text-anchor": "middle" }, signed(v, 0))));
    svg.append(grid);
    svg.append(s("line", { class: "cut", x1: L, x2: W - R, y1: Y(x.threshold), y2: Y(x.threshold) }));
    svg.append(s("text", { class: "cut-label", x: L + 8, y: Y(x.threshold) - 10 }, `corte ${pct(x.threshold, 0)}`));
    let d = ""; for (let v = MIN; v <= MAX; v += .1) d += `${d ? "L" : "M"}${X(v).toFixed(1)},${Y(sigmoid(v)).toFixed(1)}`;
    svg.append(s("path", { class: "curve", d }));

        h("p", { class: "caption", "data-r": "", style: "--d:2" }, "A função sigmoide espreme qualquer score entre 0% e 100%. Score zero vira 50%; quanto mais negativo, mais perto de 0%; quanto mais positivo, mais perto de 100%.", clamped ? " (O score desta compra passa da borda do gráfico; o ponto fica na beirada.)" : ""),
        h("div", { class: "formula", "data-r": "", style: "--d:3" }, `p = 1 / (1 + e^(−score)) = 1 / (1 + e^(${nf(-x.finalScore, 2)}))`),
        h("div", { class: "fact glass", "data-r": "", style: "--d:4;margin-top:20px;max-width:360px" }, h("span", {}, "Probabilidade de fraude"), big)),
      h("div", { class: "chart glass", "data-r": "", style: "--d:2" }, svg)));
    sigAnim = () => {
      const steps = reduced ? 1 : 70; let i = 0;
      const tick = () => {
        i++; const v = x.initialScore + (x.finalScore - x.initialScore) * (1 - Math.pow(1 - i / steps, 3));
        const px = X(v), py = Y(sigmoid(v));
        dot.setAttribute("cx", px); dot.setAttribute("cy", py);
        gx.setAttribute("x1", px); gx.setAttribute("x2", px); gx.setAttribute("y1", py); gx.setAttribute("y2", Y(0));
        gy.setAttribute("x1", L); gy.setAttribute("x2", px); gy.setAttribute("y1", py); gy.setAttribute("y2", py);
        big.textContent = pctShort(sigmoid(v));

  /* 08 — território conhecido */
  let markers = [];
  chapter("Território", el => {
    const NAMES = { amount: "Valor", age: "Idade", distance_km: "Distância" };

    const rows = x.territory.map((c, i) => {

      const marker = h("div", { class: "marker" + (c.applies && !c.inside ? " out" : "") });
      markers.push([marker, pos]);
      const status = !c.applies ? h("div", { class: "status na" }, "não se aplica") :
        c.inside ? h("div", { class: "status ok" }, "dentro ✓") : h("div", { class: "status bad" }, "fora ✗");
      return h("div", { class: "terr-row glass" + (c.applies ? "" : " na"), "data-r": "", style: `--d:${i + 2}` },
        h("h4", {}, NAMES[c.feature], h("small", {}, `esta compra: ${fmtFeature(c.feature, c.value)}`)),
        h("div", { class: "track" }, h("div", { class: "known" }),
          h("div", { class: "edge-label", style: "left:12%" }, fmtFeature(c.feature, c.min)),
          h("div", { class: "edge-label", style: "left:88%" }, fmtFeature(c.feature, c.max)), marker),
        status);
    });
    el.append(eyebrow(8, "Território conhecido"),
      display(["O modelo sabe", sp("o que não sabe")], "display md"),
      h("p", { class: "caption", "data-r": "", style: "--d:2" }, "Uma árvore só pergunta “é maior que X?”. Um valor que nunca apareceu no treino é tratado como o maior que ela viu. Por isso, fora destas faixas, a opinião do modelo não vale sozinha.", online ? " Em compras online, a distância não conta: o endereço do comércio não diz onde está o cartão." : ""),
      h("div", { class: "terr", style: "margin-top:28px" }, rows.length ? rows : h("p", { class: "caption" }, "Este modelo foi salvo sem as faixas do treino.")));
  }, () => markers.forEach(([m, pos]) => m.style.left = pos + "%"));

  /* 09 — decisão */
  chapter("Decisão", el => {
    const reasons = x.assessment.reasons?.length ? x.assessment.reasons : ["Probabilidade abaixo do corte e tudo dentro do território conhecido."];
    el.append(eyebrow(9, "A decisão"),
      h("h2", { class: "verdict " + LOOK.cls }, h("span", { class: "line" }, h("span", {}, LOOK.word))),
      h("p", { class: "caption", "data-r": "", style: "--d:2;max-width:620px" },
        `Probabilidade de fraude de ${pct(x.probability)}, para um corte de ${pct(x.threshold, 0)}.`),
      h("ul", { class: "reasons" }, reasons.map((r, i) => h("li", { class: "glass", "data-r": "", style: `--d:${i + 3}` }, r))),
      h("div", { class: "actions", "data-r": "", style: "--d:6" },
        h("a", { class: "btn", href: "painel.html" }, "← Voltar ao painel"),
        h("a", { class: "btn ghost", href: "pagar.html" }, "Fazer outra compra")));
  });

  /* navegação lateral e gatilhos de cada capítulo */
  const nav = $("chapters");
  const buttons = chapters.map((c, i) => {
    const b = h("button", { type: "button", "aria-label": c.name }, h("span", { class: "name" }, c.name), String(i).padStart(2, "0"));
    b.addEventListener("click", () => c.el.scrollIntoView({ behavior: reduced ? "auto" : "smooth" }));
    nav.append(b); return b;
  });
  const io = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      const i = chapters.findIndex(c => c.el === en.target);
      const c = chapters[i];
      c.el.classList.add("in");
      buttons.forEach((b, j) => b.classList.toggle("on", j === i));
      // o campo de partículas se agita na soma e assume a cor da decisão no fim
      field.targetAmp = i === 6 ? 1.6 : i === 9 ? 1.25 : 1;
      field.target = i === 9 ? LOOK.color : [79, 140, 255];
      if (!c.played && c.play) { c.played = true; setTimeout(c.play, reduced ? 0 : 450); }
    }
  }, { threshold: .45 });
  chapters.forEach(c => io.observe(c.el));
}

/* =====================================================================
   Carregamento
   ===================================================================== */
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  const fail = message => {
    $("loading").replaceChildren(h("div", {}, h("div", { class: "eyebrow" }, "Fraud Detector"),
      h("h2", { class: "display md" }, "Não foi possível", h("br"), h("span", { class: "s" }, "abrir esta compra")),
      h("p", {}, message), h("a", { class: "btn", href: "painel.html", style: "margin-top:16px" }, "← Voltar ao painel")));
  };
  if (!id) return fail("Abra esta página a partir de uma compra do painel.");
  try {
    const response = await fetch(`feed/${encodeURIComponent(id)}/explain`, { cache: "no-store" });
    const body = await response.json().catch(() => null);
    if (!response.ok) return fail(body?.error || `A API respondeu ${response.status}.`);
    buildStory(body);
    $("loading").remove();
    $("story").hidden = false;
  } catch {
    fail("Sem conexão com a API.");
  }
})();
</script>
</body>
</html>
